<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Kindle Paperwhite (12th gen, 2024): 7" e-ink, 1264 x 1680 @ 300ppi, portrait -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000'/%3E%3Crect x='6' y='7' width='8' height='8' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M18 9h9M18 13h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M18 20h9M18 24h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M6 21l2 2 4-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /*
      E-ink first. No greys that matter, no colour, no animation, no reflow churn.
      Pure #000 on #fff, hairlines for structure, big type for a 300ppi panel read
      at arm's length. System sans only — the Kindle browser can't fetch web fonts.
    */
    :root {
      --ink: #000;
      --paper: #fff;
      --line: #000;
      --hair: #9a9a9a;      /* faint row dividers — dithers to a light dot pattern */
      --frame: 6px;
      --pad: 30px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
      -webkit-font-smoothing: none;   /* crisper edges on e-ink */
      text-rendering: optimizeLegibility;
    }

    /* Page = the printed sheet inside a hard black frame, matching the mockup. */
    .sheet {
      max-width: 780px;
      margin: 0 auto;
      min-height: 100vh;
      border: var(--frame) solid var(--line);
      padding: var(--pad) var(--pad) 20px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Masthead ---------- */
    .masthead h1 {
      margin: 0;
      font-size: 60px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .masthead .updated {
      margin: 12px 0 0;
      font-size: 20px;
      font-weight: 400;
    }

    .rule       { border: 0; border-top: 3px solid var(--line); margin: 20px 0; }
    .rule-thick { border: 0; border-top: 4px solid var(--line); margin: 24px 0 22px; }

    /* ---------- Info strip: weather · trains · events ---------- */
    .strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 0;
    }
    .strip .col { padding: 4px 16px; min-width: 0; }
    .strip .col + .col { border-left: 2px solid var(--line); }
    .strip .col:first-child { padding-left: 4px; }
    .strip .col:last-child  { padding-right: 4px; }

    .col-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .col-head .ico { width: 30px; height: 30px; flex: none; }
    .col-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    /* Weather — icons from Erik Flowers' weather-icons (currentColor → ink). */
    .wi { color: var(--ink); }
    .weather { display: flex; align-items: center; gap: 14px; }
    .weather .big-ico { width: 76px; height: 76px; flex: none; }
    .weather .temp { font-size: 44px; font-weight: 800; line-height: 1; }
    .weather .cond { font-size: 20px; margin-top: 4px; }
    .hilo { font-size: 18px; margin-top: 18px; }
    .extra { font-size: 17px; margin-top: 10px; line-height: 1.5; }
    .wx-loc { font-size: 14px; margin-top: 10px; letter-spacing: .3px; color: #444; }

    /* Train status (運行情報) */
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .lines li:last-child { margin-bottom: 0; }
    .marker { width: 30px; height: 30px; flex: none; margin-top: 2px; }
    .line-name { font-size: 18px; line-height: 1.2; font-weight: 700; }
    .line-state { font-size: 15px; margin-top: 2px; }
    .line-state.alert { font-weight: 700; }

    /* Next-train panel — only shown during the 11:00–12:00 interval window. */
    .nexttrain { margin-top: 16px; border-top: 2px solid var(--line); padding-top: 12px; }
    .nexttrain h3 {
      margin: 0 0 4px; font-size: 14px; font-weight: 800; letter-spacing: .5px;
    }
    .nexttrain .route { font-size: 13px; margin-bottom: 10px; }
    .nt-list { list-style: none; margin: 0; padding: 0; }
    .nt-list li { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 9px; }
    .nt-list li:last-child { margin-bottom: 0; }
    .nt-badge {
      flex: none; display: inline-grid; place-items: center;
      min-width: 22px; height: 22px; padding: 0 4px;
      border: 2px solid var(--line); border-radius: 5px;
      font-size: 13px; font-weight: 800;
    }
    .nt-eta { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
    .nt-dst { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nt-late { font-weight: 700; white-space: nowrap; }
    .nt-empty { font-size: 14px; }

    /* Events */
    .events { list-style: none; margin: 0; padding: 0; }
    .events li { display: flex; gap: 14px; font-size: 19px; margin-bottom: 14px; }
    .events li:last-child { margin-bottom: 0; }
    .events .t { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---------- Todo ---------- */
    .todo-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .todo-head h2 {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .todo-head .count { font-size: 24px; font-variant-numeric: tabular-nums; }

    .todo { list-style: none; margin: 18px 0 0; padding: 0; }
    .todo li { border-top: 1px solid var(--hair); }
    .todo li:first-child { border-top: 0; }

    /* Each row is a big label — comfortable tap target on the touchscreen. */
    .todo label {
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 22px 4px;
      cursor: pointer;
      font-size: 26px;
    }
    .todo input { position: absolute; opacity: 0; pointer-events: none; }

    .box {
      width: 40px;
      height: 40px;
      flex: none;
      border: 3px solid var(--line);
      border-radius: 6px;
      display: grid;
      place-items: center;
    }
    /* Tick hidden until the row is checked. */
    .box .tick { width: 30px; height: 30px; visibility: hidden; }
    .todo input:checked + .box .tick { visibility: visible; }

    /* Fill remaining space so the frame reaches the bottom of the panel. */
    .spacer { flex: 1 1 auto; }

    /* Give the whole sheet a touch more room on the tall Kindle panel. */
    @media (min-aspect-ratio: 1/1) {
      .sheet { max-width: 900px; }
    }
  </style>
</head>
<body>
  <div class="sheet">

    <header class="masthead">
      <h1>DASHBOARD</h1>
      <p class="updated">Last Updated: <span id="updated">—</span>
        &nbsp;&middot;&nbsp; Next: <span id="nextUpdate">—</span></p>
    </header>

    <hr class="rule">

    <section class="strip">
      <!-- Weather — Shibuya, Tokyo via Go /api/weather (Open-Meteo proxy).
           Icons: Erik Flowers' weather-icons (web/img/weather). -->
      <div class="col">
        <div class="col-head">
          <img class="ico wi" id="wxHeadIcon" src="./img/weather/wi-day-cloudy.svg" width="30" height="30" alt="">
          <h2>WEATHER</h2>
        </div>
        <div class="weather">
          <img class="big-ico wi" id="wxIcon" src="./img/weather/wi-day-sunny.svg" width="76" height="76" alt="">
          <div>
            <div class="temp"><span id="wxTemp">--</span>&deg;C</div>
            <div class="cond" id="wxCond">&mdash;</div>
          </div>
        </div>
        <div class="hilo">H:<span id="wxHigh">--</span>&deg;&nbsp;&nbsp;L:<span id="wxLow">--</span>&deg;
          &nbsp;&nbsp;体感<span id="wxFeels">--</span>&deg;</div>
        <div class="extra" id="wxExtra">&mdash;</div>
        <div class="wx-loc">渋谷 · <span id="wxObs">--:--</span> 時点</div>
      </div>

      <!-- Train status -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="6" width="24" height="26" rx="6" fill="none" stroke="#000" stroke-width="2.5"/>
            <rect x="16" y="11" width="16" height="9" rx="2" fill="#000"/>
            <circle cx="19" cy="26" r="2.4" fill="#000"/>
            <circle cx="29" cy="26" r="2.4" fill="#000"/>
            <path d="M17 33l-4 8M31 33l4 8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <h2>運行情報</h2>
        </div>
        <!-- Populated from Go /api/diainfo (Yahoo! transit area 4 scrape). -->
        <ul class="lines" id="lineList">
          <li><div><div class="line-state">読み込み中…</div></div></li>
        </ul>
        <!-- 次の電車: 幡ヶ谷→新線新宿, from the live Keio feed. Shown only
             during the 11:00–12:00 interval window. -->
        <div class="nexttrain" id="nextTrain" hidden>
          <h3>次の電車</h3>
          <div class="route">幡ヶ谷 &rarr; 新線新宿（上り）</div>
          <ul class="nt-list" id="ntList"></ul>
        </div>
      </div>

      <!-- Events -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="9" width="36" height="33" rx="4" fill="none" stroke="#000" stroke-width="2.5"/>
            <path d="M6 18h36" stroke="#000" stroke-width="2.5"/>
            <path d="M15 5v8M33 5v8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
            <g fill="#000">
              <rect x="13" y="24" width="4" height="4"/><rect x="22" y="24" width="4" height="4"/><rect x="31" y="24" width="4" height="4"/>
              <rect x="13" y="32" width="4" height="4"/><rect x="22" y="32" width="4" height="4"/><rect x="31" y="32" width="4" height="4"/>
            </g>
          </svg>
          <h2>TODAY&rsquo;S EVENTS</h2>
        </div>
        <ul class="events">
          <li><span class="t">09:00</span><span>Team Meeting</span></li>
          <li><span class="t">14:00</span><span>Dentist</span></li>
          <li><span class="t">19:00</span><span>Dinner</span></li>
          <li><span class="t">21:00</span><span>Read / Relax</span></li>
        </ul>
      </div>
    </section>

    <hr class="rule-thick">

    <section>
      <div class="todo-head">
        <h2>TODAY&rsquo;S TODO</h2>
        <div class="count"><span id="done">3</span> / <span id="total">8</span> completed</div>
      </div>

      <ul class="todo" id="todoList">
        <li><label><input type="checkbox"><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Finish AWS presentation</span></label></li>
        <li><label><input type="checkbox" checked><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Buy groceries</span></label></li>
        <li><label><input type="checkbox"><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Call bank</span></label></li>
        <li><label><input type="checkbox"><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Japanese homework</span></label></li>
        <li><label><input type="checkbox"><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Read 20 pages</span></label></li>
        <li><label><input type="checkbox" checked><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Workout</span></label></li>
        <li><label><input type="checkbox"><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Plan weekend trip</span></label></li>
        <li><label><input type="checkbox" checked><span class="box"><svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">Review pull requests</span></label></li>
      </ul>
    </section>

    <div class="spacer"></div>
  </div>

  <script src="./dashboard.js"></script>
</body>
</html>
