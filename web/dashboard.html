<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Kindle Paperwhite (12th gen, 2024): 7" e-ink, 1264 x 1680 @ 300ppi, portrait -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000'/%3E%3Crect x='6' y='7' width='8' height='8' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M18 9h9M18 13h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M18 20h9M18 24h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M6 21l2 2 4-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /*
      E-ink first. No greys that matter, no colour, no animation, no reflow churn.
      Pure #000 on #fff, hairlines for structure, big type for a 300ppi panel read
      at arm's length. System sans only — the Kindle browser can't fetch web fonts.
    */
    :root {
      --ink: #000;
      --paper: #fff;
      --line: #000;
      --hair: #9a9a9a;      /* faint row dividers — dithers to a light dot pattern */
      --frame: 6px;
      --pad: 30px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
      -webkit-font-smoothing: none;   /* crisper edges on e-ink */
      text-rendering: optimizeLegibility;
    }

    /* Page = the printed sheet inside a hard black frame, matching the mockup. */
    .sheet {
      max-width: 780px;
      margin: 0 auto;
      min-height: 100vh;
      border: var(--frame) solid var(--line);
      padding: var(--pad) var(--pad) 20px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Masthead ---------- */
    .masthead h1 {
      margin: 0;
      font-size: 60px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .masthead .updated {
      margin: 12px 0 0;
      font-size: 20px;
      font-weight: 400;
    }

    .rule       { border: 0; border-top: 3px solid var(--line); margin: 20px 0; }
    .rule-thick { border: 0; border-top: 4px solid var(--line); margin: 24px 0 22px; }

    /* ---------- Info strip: weather · trains · events ---------- */
    .strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 0;
    }
    .strip .col { padding: 4px 16px; min-width: 0; }
    .strip .col + .col { border-left: 2px solid var(--line); }
    .strip .col:first-child { padding-left: 4px; }
    .strip .col:last-child  { padding-right: 4px; }

    .col-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .col-head .ico { width: 30px; height: 30px; flex: none; }
    .col-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    /* Weather */
    .weather { display: flex; align-items: center; gap: 14px; }
    .weather .big-ico { width: 70px; height: 70px; flex: none; }
    .weather .temp { font-size: 44px; font-weight: 800; line-height: 1; }
    .weather .cond { font-size: 20px; margin-top: 4px; }
    .weather .hilo { font-size: 18px; margin-top: 18px; }
    .weather .extra { font-size: 18px; margin-top: 10px; }

    /* Train status */
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .lines li:last-child { margin-bottom: 0; }
    .marker { width: 32px; height: 32px; flex: none; margin-top: 4px; }
    .line-name { font-size: 18px; line-height: 1.2; }
    .line-state { font-size: 16px; }

    /* Events */
    .events { list-style: none; margin: 0; padding: 0; }
    .events li { display: flex; gap: 14px; font-size: 19px; margin-bottom: 14px; }
    .events li:last-child { margin-bottom: 0; }
    .events .t { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---------- Todo ---------- */
    .todo-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .todo-head h2 {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .todo-head .count { font-size: 24px; font-variant-numeric: tabular-nums; }

    .todo { list-style: none; margin: 18px 0 0; padding: 0; }
    .todo li { border-top: 1px solid var(--hair); }
    .todo li:first-child { border-top: 0; }

    /* Each row is a big label — comfortable tap target on the touchscreen. */
    .todo label {
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 22px 4px;
      cursor: pointer;
      font-size: 26px;
    }
    .todo input { position: absolute; opacity: 0; pointer-events: none; }

    .box {
      width: 40px;
      height: 40px;
      flex: none;
      border: 3px solid var(--line);
      border-radius: 6px;
      display: grid;
      place-items: center;
    }
    /* Tick hidden until the row is checked. */
    .box .tick { width: 30px; height: 30px; visibility: hidden; }
    .todo input:checked + .box .tick { visibility: visible; }

    /* ---------- Add-task form ---------- */
    .todo-add {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .todo-add input {
      flex: 1 1 auto;
      font-size: 20px;
      font-family: inherit;
      border: 2px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
      background: var(--paper);
      color: var(--ink);
    }
    .todo-add button {
      font-size: 18px;
      font-weight: 800;
      font-family: inherit;
      border: 2px solid var(--line);
      border-radius: 4px;
      background: var(--ink);
      color: var(--paper);
      padding: 0 22px;
      cursor: pointer;
    }

    /* Fill remaining space so the frame reaches the bottom of the panel. */
    .spacer { flex: 1 1 auto; }

    /* Give the whole sheet a touch more room on the tall Kindle panel. */
    @media (min-aspect-ratio: 1/1) {
      .sheet { max-width: 900px; }
    }
  </style>
</head>
<body>
  <div class="sheet">

    <header class="masthead">
      <h1>DASHBOARD</h1>
      <p class="updated">Last Updated: <span id="updated">May 20, 2025</span></p>
    </header>

    <hr class="rule">

    <section class="strip">
      <!-- Weather -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <g stroke="#000" stroke-width="2.4" stroke-linecap="round" fill="none">
              <circle cx="16" cy="15" r="6.5" fill="#fff"/>
              <path d="M16 3.5V6.5M24.13 6.87 22 9M27.5 15H24.5M7.87 6.87 10 9M4.5 15H7.5"/>
            </g>
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"
                  transform="translate(15,17)"
                  fill="#fff" stroke="#000" stroke-width="2.3" stroke-linejoin="round"/>
          </svg>
          <h2>WEATHER</h2>
        </div>
        <div class="weather">
          <svg class="big-ico" viewBox="0 0 48 48" aria-hidden="true">
            <g stroke="#000" stroke-width="2.2" stroke-linecap="round" fill="none">
              <circle cx="16" cy="15" r="6.5" fill="#fff"/>
              <path d="M16 3.5V6.5M24.13 6.87 22 9M27.5 15H24.5M7.87 6.87 10 9M4.5 15H7.5"/>
            </g>
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"
                  transform="translate(15,17)"
                  fill="#fff" stroke="#000" stroke-width="2.1" stroke-linejoin="round"/>
          </svg>
          <div>
            <div class="temp"><span id="wx-temp">&hellip;</span>&deg;C</div>
            <div class="cond" id="wx-cond">&hellip;</div>
          </div>
        </div>
        <div class="hilo">H:<span id="wx-high">&hellip;</span>&deg;&nbsp;&nbsp;L:<span id="wx-low">&hellip;</span>&deg;</div>
        <div class="extra">Rain <span id="wx-precip">&hellip;</span>%&nbsp;&nbsp;&bull;&nbsp;&nbsp;Humidity <span id="wx-humidity">&hellip;</span>%</div>
      </div>

      <!-- Train status -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="6" width="24" height="26" rx="6" fill="none" stroke="#000" stroke-width="2.5"/>
            <rect x="16" y="11" width="16" height="9" rx="2" fill="#000"/>
            <circle cx="19" cy="26" r="2.4" fill="#000"/>
            <circle cx="29" cy="26" r="2.4" fill="#000"/>
            <path d="M17 33l-4 8M31 33l4 8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <h2>運行情報</h2>
        </div>
        <ul class="lines" id="linesList">
          <li><div class="line-name">Loading&hellip;</div></li>
        </ul>
      </div>

      <!-- Events -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="9" width="36" height="33" rx="4" fill="none" stroke="#000" stroke-width="2.5"/>
            <path d="M6 18h36" stroke="#000" stroke-width="2.5"/>
            <path d="M15 5v8M33 5v8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
            <g fill="#000">
              <rect x="13" y="24" width="4" height="4"/><rect x="22" y="24" width="4" height="4"/><rect x="31" y="24" width="4" height="4"/>
              <rect x="13" y="32" width="4" height="4"/><rect x="22" y="32" width="4" height="4"/><rect x="31" y="32" width="4" height="4"/>
            </g>
          </svg>
          <h2>TODAY&rsquo;S EVENTS</h2>
        </div>
        <ul class="events" id="eventsList">
          <li><span>Loading&hellip;</span></li>
        </ul>
      </div>
    </section>

    <hr class="rule-thick">

    <section>
      <div class="todo-head">
        <h2>TODAY&rsquo;S TODO</h2>
        <div class="count"><span id="done">3</span> / <span id="total">8</span> completed</div>
      </div>

      <ul class="todo" id="todoList"></ul>

      <form id="todoAddForm" class="todo-add">
        <input type="text" id="todoAddInput" placeholder="Add a task&hellip;" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </section>

    <div class="spacer"></div>
  </div>

  <script>
    (function () {
      var REFRESH_MS = 5 * 60 * 1000; // e-ink panel: no need to poll fast

      function el(tag, cls, html) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        return e;
      }

      function setUpdated() {
        document.getElementById('updated').textContent =
          new Date().toLocaleString(undefined, {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
      }

      // ---- Weather ----
      function loadWeather() {
        fetch('/api/weather').then(function (r) { return r.json(); }).then(function (w) {
          if (w.error) throw new Error(w.error);
          document.getElementById('wx-temp').textContent = Math.round(w.tempC);
          document.getElementById('wx-cond').textContent = w.condition;
          document.getElementById('wx-high').textContent = Math.round(w.highC);
          document.getElementById('wx-low').textContent = Math.round(w.lowC);
          document.getElementById('wx-precip').textContent = w.precipPct;
          document.getElementById('wx-humidity').textContent = w.humidityPct;
        }).catch(function () {
          document.getElementById('wx-cond').textContent = 'Unavailable';
        });
      }

      // ---- Train status (from the Keio live feed already served by this app) ----
      function loadLines() {
        fetch('/api/state').then(function (r) { return r.json(); }).then(function (st) {
          var svc = (st && st.service) || {};
          var rows = [
            ['京王線', svc.keio],
            ['井の頭線', svc.inokashira],
          ];
          var ul = document.getElementById('linesList');
          ul.innerHTML = '';
          rows.forEach(function (row) {
            var name = row[0], s = row[1];
            var icon = (s && s.level === 'normal') ? './img/normal.svg' : './img/adjust.svg';
            var li = el('li');
            var img = el('img', 'marker');
            img.src = icon; img.width = 32; img.height = 32;
            li.appendChild(img);
            li.appendChild(el('div', null,
              '<div class="line-name">' + name + '</div>' +
              '<div class="line-state">' + ((s && s.text) || 'Unknown') + '</div>'));
            ul.appendChild(li);
          });
        }).catch(function () {
          document.getElementById('linesList').innerHTML = '<li><div class="line-name">Unavailable</div></li>';
        });
      }

      // ---- Today's events (Google Calendar) ----
      function loadEvents() {
        fetch('/api/events').then(function (r) { return r.json(); }).then(function (events) {
          var ul = document.getElementById('eventsList');
          ul.innerHTML = '';
          if (!Array.isArray(events) || events.length === 0) {
            ul.appendChild(el('li', null, '<span>No events today</span>'));
            return;
          }
          events.forEach(function (ev) {
            var li = el('li');
            li.appendChild(el('span', 't', ev.allDay ? 'All day' : ev.time));
            li.appendChild(el('span', null, ev.title));
            ul.appendChild(li);
          });
        }).catch(function () {
          document.getElementById('eventsList').innerHTML = '<li><span>Unavailable</span></li>';
        });
      }

      // ---- Todos (persisted via SQLite-backed API) ----
      function tickSvg() {
        return '<svg class="tick" viewBox="0 0 32 32" aria-hidden="true">' +
          '<path d="M6 17l6.5 6.5L26 9" fill="none" stroke="#000" stroke-width="3.4" ' +
          'stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }

      function renderTodos(items) {
        var ul = document.getElementById('todoList');
        ul.innerHTML = '';
        items.forEach(function (t) {
          var li = el('li');
          var label = el('label');
          var input = el('input');
          input.type = 'checkbox';
          input.checked = !!t.done;
          input.addEventListener('change', function () {
            fetch('/api/todos/' + t.id, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ done: input.checked })
            }).then(loadTodos);
          });
          label.appendChild(input);
          label.appendChild(el('span', 'box', tickSvg()));
          label.appendChild(el('span', 'txt', t.text));
          li.appendChild(label);
          ul.appendChild(li);
        });
        document.getElementById('total').textContent = items.length;
        document.getElementById('done').textContent = items.filter(function (t) { return t.done; }).length;
      }

      function loadTodos() {
        return fetch('/api/todos').then(function (r) { return r.json(); }).then(renderTodos);
      }

      document.getElementById('todoAddForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var input = document.getElementById('todoAddInput');
        var text = input.value.trim();
        if (!text) return;
        fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        }).then(function () {
          input.value = '';
          return loadTodos();
        });
      });

      function loadAll() {
        setUpdated();
        loadWeather();
        loadLines();
        loadEvents();
        loadTodos();
      }

      loadAll();
      setInterval(loadAll, REFRESH_MS);
    })();
  </script>
</body>
</html>
