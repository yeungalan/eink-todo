<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Kindle Paperwhite (12th gen, 2024): 7" e-ink, 1264 x 1680 @ 300ppi, portrait -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000'/%3E%3Crect x='6' y='7' width='8' height='8' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M18 9h9M18 13h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M18 20h9M18 24h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M6 21l2 2 4-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /*
      E-ink first. No greys that matter, no colour, no animation, no reflow churn.
      Pure #000 on #fff, hairlines for structure, big type for a 300ppi panel read
      at arm's length. System sans only — the Kindle browser can't fetch web fonts.
    */
    :root {
      --ink: #000;
      --paper: #fff;
      --line: #000;
      --hair: #9a9a9a;      /* faint row dividers — dithers to a light dot pattern */
      --frame: 6px;
      --pad: 30px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
      -webkit-font-smoothing: none;   /* crisper edges on e-ink */
      text-rendering: optimizeLegibility;
    }

    /* Page = the printed sheet inside a hard black frame, matching the mockup. */
    .sheet {
      max-width: 780px;
      margin: 0 auto;
      min-height: 100vh;
      border: var(--frame) solid var(--line);
      padding: var(--pad) var(--pad) 20px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Masthead ---------- */
    .masthead h1 {
      margin: 0;
      font-size: 60px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .masthead .updated {
      margin: 12px 0 0;
      font-size: 20px;
      font-weight: 400;
    }

    .rule       { border: 0; border-top: 3px solid var(--line); margin: 20px 0; }
    .rule-thick { border: 0; border-top: 4px solid var(--line); margin: 24px 0 22px; }

    /* ---------- Info strip: weather · trains · events ---------- */
    .strip {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 0;
    }
    .strip .col { padding: 4px 16px; min-width: 0; }
    .strip .col + .col { border-left: 2px solid var(--line); }
    .strip .col:first-child { padding-left: 4px; }
    .strip .col:last-child  { padding-right: 4px; }

    .col-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .col-head .ico { width: 30px; height: 30px; flex: none; }
    .col-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    /* Weather */
    .weather { display: flex; align-items: center; gap: 14px; }
    .weather .big-ico { width: 70px; height: 70px; flex: none; }
    .weather .temp { font-size: 44px; font-weight: 800; line-height: 1; }
    .weather .cond { font-size: 20px; margin-top: 4px; }
    .weather .hilo { font-size: 18px; margin-top: 18px; }
    .weather .extra { font-size: 18px; margin-top: 10px; }

    /* Train status */
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .lines li:last-child { margin-bottom: 0; }
    .marker { width: 32px; height: 32px; flex: none; margin-top: 4px; }
    .line-name { font-size: 18px; line-height: 1.2; }
    .line-state { font-size: 16px; }

    /* Events */
    .events { list-style: none; margin: 0; padding: 0; }
    .events li { display: flex; gap: 14px; font-size: 19px; margin-bottom: 14px; }
    .events li:last-child { margin-bottom: 0; }
    .events .t { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---------- Todo ---------- */
    .todo-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .todo-head h2 {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .todo-head .count { font-size: 24px; font-variant-numeric: tabular-nums; }

    .todo { list-style: none; margin: 18px 0 0; padding: 0; }
    .todo li { border-top: 1px solid var(--hair); }
    .todo li:first-child { border-top: 0; }

    /* Each row is a big label — comfortable tap target on the touchscreen. */
    .todo label {
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 22px 4px;
      cursor: pointer;
      font-size: 26px;
    }
    .todo input { position: absolute; opacity: 0; pointer-events: none; }

    .box {
      width: 40px;
      height: 40px;
      flex: none;
      border: 3px solid var(--line);
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 30px;
      line-height: 1;
    }
    /* Tick hidden until the row is checked. */
    .box .tick { visibility: hidden; }
    .todo input:checked + .box .tick { visibility: visible; }

    /* Fill remaining space so the frame reaches the bottom of the panel. */
    .spacer { flex: 1 1 auto; }

    /* Give the whole sheet a touch more room on the tall Kindle panel. */
    @media (min-aspect-ratio: 1/1) {
      .sheet { max-width: 900px; }
    }
  </style>
</head>
<body>
  <div class="sheet">

    <header class="masthead">
      <h1>DASHBOARD</h1>
      <p class="updated">Last Updated: <span id="updated">May 20, 2025</span></p>
    </header>

    <hr class="rule">

    <section class="strip">
      <!-- Weather -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="18" cy="16" r="8" fill="none" stroke="#000" stroke-width="2.5"/>
            <g stroke="#000" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 3v4M18 25v4M5 16h4M27 16h4M8.8 6.8l2.8 2.8M24.6 22.6l2.8 2.8M27.2 6.8l-2.8 2.8"/>
            </g>
            <path d="M14 34a8 8 0 0 1 15.4-3A6.5 6.5 0 1 1 30 44H16a6 6 0 0 1-2-10z"
                  fill="#fff" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
          </svg>
          <h2>WEATHER</h2>
        </div>
        <div class="weather">
          <svg class="big-ico" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="18" cy="16" r="8" fill="none" stroke="#000" stroke-width="2.2"/>
            <g stroke="#000" stroke-width="2.2" stroke-linecap="round">
              <path d="M18 3v4M18 25v4M5 16h4M27 16h4M8.8 6.8l2.8 2.8M24.6 22.6l2.8 2.8M27.2 6.8l-2.8 2.8"/>
            </g>
            <path d="M14 34a8 8 0 0 1 15.4-3A6.5 6.5 0 1 1 30 44H16a6 6 0 0 1-2-10z"
                  fill="#fff" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/>
          </svg>
          <div>
            <div class="temp">28&deg;C</div>
            <div class="cond">Sunny</div>
          </div>
        </div>
        <div class="hilo">H:31&deg;&nbsp;&nbsp;L:25&deg;</div>
        <div class="extra">Rain 5%&nbsp;&nbsp;&bull;&nbsp;&nbsp;Humidity 68%</div>
      </div>

      <!-- Train status -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="6" width="24" height="26" rx="6" fill="none" stroke="#000" stroke-width="2.5"/>
            <rect x="16" y="11" width="16" height="9" rx="2" fill="#000"/>
            <circle cx="19" cy="26" r="2.4" fill="#000"/>
            <circle cx="29" cy="26" r="2.4" fill="#000"/>
            <path d="M17 33l-4 8M31 33l4 8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <h2>運行情報</h2>
        </div>
        <ul class="lines">
          <li>
            <img class="marker" src="./img/info.svg" width="32" height="32">
            <div><div class="line-name">JR 山手線</div><div class="line-state">平常運転</div></div>
          </li>
          <li>
            <img class="marker" src="./img/normal.svg" width="32" height="32">
            <div><div class="line-name">都営新宿線</div><div class="line-state">運転見合わせ</div></div>
          </li>
          <li>
            <img class="marker" src="./img/adjust.svg" width="32" height="32">
            <div><div class="line-name">京王線</div><div class="line-state">運転見合わせ</div></div>
          </li>
        </ul>
      </div>

      <!-- Events -->
      <div class="col">
        <div class="col-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="9" width="36" height="33" rx="4" fill="none" stroke="#000" stroke-width="2.5"/>
            <path d="M6 18h36" stroke="#000" stroke-width="2.5"/>
            <path d="M15 5v8M33 5v8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
            <g fill="#000">
              <rect x="13" y="24" width="4" height="4"/><rect x="22" y="24" width="4" height="4"/><rect x="31" y="24" width="4" height="4"/>
              <rect x="13" y="32" width="4" height="4"/><rect x="22" y="32" width="4" height="4"/><rect x="31" y="32" width="4" height="4"/>
            </g>
          </svg>
          <h2>TODAY&rsquo;S EVENTS</h2>
        </div>
        <ul class="events">
          <li><span class="t">09:00</span><span>Team Meeting</span></li>
          <li><span class="t">14:00</span><span>Dentist</span></li>
          <li><span class="t">19:00</span><span>Dinner</span></li>
          <li><span class="t">21:00</span><span>Read / Relax</span></li>
        </ul>
      </div>
    </section>

    <hr class="rule-thick">

    <section>
      <div class="todo-head">
        <h2>TODAY&rsquo;S TODO</h2>
        <div class="count"><span id="done">3</span> / <span id="total">8</span> completed</div>
      </div>

      <ul class="todo" id="todoList">
        <li><label><input type="checkbox"><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Finish AWS presentation</span></label></li>
        <li><label><input type="checkbox" checked><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Buy groceries</span></label></li>
        <li><label><input type="checkbox"><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Call bank</span></label></li>
        <li><label><input type="checkbox"><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Japanese homework</span></label></li>
        <li><label><input type="checkbox"><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Read 20 pages</span></label></li>
        <li><label><input type="checkbox" checked><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Workout</span></label></li>
        <li><label><input type="checkbox"><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Plan weekend trip</span></label></li>
        <li><label><input type="checkbox" checked><span class="box"><span class="tick">&#10003;</span></span><span class="txt">Review pull requests</span></label></li>
      </ul>
    </section>

    <div class="spacer"></div>
  </div>

  <script>
    // Keep the "done / total" counter honest as boxes are tapped, and stamp the
    // real date into the header. Everything else is static markup so the panel
    // still renders correctly if scripting is disabled in the Kindle browser.
    (function () {
      var boxes = Array.prototype.slice.call(
        document.querySelectorAll('#todoList input[type=checkbox]'));
      var done = document.getElementById('done');
      var total = document.getElementById('total');
      total.textContent = boxes.length;

      function recount() {
        done.textContent = boxes.filter(function (b) { return b.checked; }).length;
      }
      boxes.forEach(function (b) { b.addEventListener('change', recount); });
      recount();

      try {
        var d = new Date();
        var m = ['January','February','March','April','May','June','July',
                 'August','September','October','November','December'];
        document.getElementById('updated').textContent =
          m[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
      } catch (e) {}
    })();
  </script>
</body>
</html>
