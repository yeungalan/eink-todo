<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- Kindle Paperwhite (12th gen, 2024): 7" e-ink, 1264 x 1680 @ 300ppi, portrait -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ダッシュボード</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000'/%3E%3Crect x='6' y='7' width='8' height='8' rx='1.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M18 9h9M18 13h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M18 20h9M18 24h9' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M6 21l2 2 4-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    /*
      E-ink first. No greys that matter, no colour, no animation, no reflow churn.
      Pure #000 on #fff, hairlines for structure, big type for a 300ppi panel read
      at arm's length. System sans only — the Kindle browser can't fetch web fonts.
    */
    :root {
      --ink: #000;
      --paper: #fff;
      --line: #000;
      --hair: #9a9a9a;      /* faint row dividers — dithers to a light dot pattern */
      --pad: 30px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
      -webkit-font-smoothing: none;   /* crisper edges on e-ink */
      text-rendering: optimizeLegibility;
    }

    /* Page = the printed sheet inside a hard black frame, matching the mockup. */
    .sheet {
      max-width: 780px;
      margin: 0 auto;
      min-height: 100vh;
      padding: var(--pad) var(--pad) 20px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Masthead ---------- */
    .masthead h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .masthead .updated {
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 400;
    }

    .rule { border: 0; border-top: 3px solid var(--line); margin: 20px 0; }

    /* Commute-mode alert: a train is due within 5 min. Inverted (black on
       white becomes white on black) so it reads as a distinct, urgent block
       even on e-ink's flat contrast, and sits above the rotating panels so
       it's visible no matter which of the two commute panels is showing. */
    .alert {
      display: flex; align-items: center; gap: 14px;
      background: var(--ink); color: var(--paper);
      padding: 14px 18px; margin: 0 0 20px;
      font-size: 22px; font-weight: 800;
    }
    .alert[hidden] { display: none; }
    .alert-badge {
      flex: none; font-size: 14px; font-weight: 800; letter-spacing: 1px;
      border: 1.5px solid var(--paper); border-radius: 4px; padding: 3px 8px;
    }

    /* ---------- Rotator: one full-width panel visible at a time ---------- */
    #panels { flex: 1 1 auto; position: relative; }
    .panel { display: none; }
    .panel.active {
      display: block;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .panel-head .ico { width: 40px; height: 40px; flex: none; }
    .panel-head h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* Weather */
    .weather { display: flex; align-items: center; gap: 20px; }
    .weather .big-ico { width: 100px; height: 100px; flex: none; }
    .weather .temp { font-size: 64px; font-weight: 800; line-height: 1; }
    .weather .cond { font-size: 28px; margin-top: 6px; }
    .wx-feels { font-size: 22px; margin-top: 20px; }

    .wx-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px 32px;
      margin-top: 26px;
    }
    .wx-label { font-size: 14px; font-weight: 400; letter-spacing: .5px; }
    .wx-value { font-size: 24px; font-weight: 700; margin-top: 4px; }

    /* Train status */
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
    .lines li:last-child { margin-bottom: 0; }
    .marker { width: 30px; height: 30px; flex: none; display: block; }
    .line-name { font-size: 26px; line-height: 1.2; }
    .line-state { font-size: 20px; }

    /* Hatagaya next-trains board: big ETA first, like a real platform sign.
       Sized compactly (vs. the rest of the dashboard) so two directions x
       hatagayaTrainsMax rows fit one panel without scrolling — the Kindle
       has no practical way to scroll a static rotation panel. */
    .tgroup { margin-bottom: 14px; }
    .tgroup:last-child { margin-bottom: 0; }
    .tgroup-label {
      font-size: 15px; font-weight: 800; letter-spacing: 1px;
      padding-bottom: 3px; border-bottom: 2px solid var(--line);
      margin-bottom: 2px;
    }
    .trains { list-style: none; margin: 0; padding: 0; }
    .trains li {
      display: flex; align-items: baseline; gap: 16px;
      padding: 8px 0; border-top: 1px solid var(--hair);
    }
    .trains li:first-child { border-top: 0; }
    .trains .eta {
      flex: none; width: 62px;
      font-size: 26px; font-weight: 800; line-height: 1;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .trains .eta.now { font-size: 18px; }
    .trains .eta small { font-size: 14px; font-weight: 400; margin-left: 1px; }
    .trains .tinfo { flex: 1 1 auto; min-width: 0; }
    .trains .ttype { font-size: 19px; line-height: 1.2; }
    .trains .tmeta { font-size: 13px; margin-top: 2px; }
    /* Schedule-derived fallback rows (no live position data) — timetable
       estimate rather than a tracked train, set apart with italics. */
    .trains .tinfo.estimated { font-style: italic; opacity: 0.75; }

    /* Events */
    .events { list-style: none; margin: 0; padding: 0; }
    .events li { display: flex; gap: 18px; font-size: 26px; margin-bottom: 18px; align-items: baseline; }
    .events li:last-child { margin-bottom: 0; }
    .events .t { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Trello cards due this week, merged into the events list below the
       calendar entries; a bordered badge instead of a clock time sets them
       apart from actual scheduled events. */
    .events .subhead {
      font-size: 16px; font-weight: 800; letter-spacing: 1px;
      border-top: 2px solid var(--line); margin: 22px 0 4px; padding-top: 14px;
    }
    .events .tag {
      flex: none; font-size: 14px; font-weight: 800; white-space: nowrap;
      border: 1.5px solid var(--line); border-radius: 4px; padding: 3px 8px;
    }
    .events .tag.due-today { background: var(--ink); color: var(--paper); }

    /* ---------- Rotation progress dots ---------- */
    .dots { display: flex; justify-content: center; gap: 12px; padding-top: 18px; }
    .dots span {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--paper);
    }
    .dots span.active { background: var(--ink); }

    /* ---------- Todo ---------- */
    .todo-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .todo-head h2 {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .todo-head .count { font-size: 24px; font-variant-numeric: tabular-nums; }

    .todo { list-style: none; margin: 18px 0 0; padding: 0; }
    .todo li { border-top: 1px solid var(--hair); }
    .todo li:first-child { border-top: 0; }

    .todo .row {
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 20px 4px;
      font-size: 26px;
    }

    /* Due-date badge at the end of a todo row. */
    .due {
      margin-left: auto;
      flex: none;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding-left: 16px;
    }
    .due.overdue { font-weight: 800; }

    /* Fill remaining space so the frame reaches the bottom of the panel. */
    .spacer { flex: 1 1 auto; }

    /* Give the whole sheet a touch more room on the tall Kindle panel. */
    @media (min-aspect-ratio: 1/1) {
      .sheet { max-width: 900px; }
    }
  </style>
</head>
<body>
  <div class="sheet">

    <header class="masthead">
      <h1>ダッシュボード</h1>
      <p class="updated">更新：<span id="updated">&hellip;</span></p>
    </header>

    <hr class="rule">

    <div class="alert" id="commuteAlert" hidden>
      <span class="alert-badge">まもなく到着</span>
      <span id="commuteAlertText"></span>
    </div>

    <div id="panels">
      <!-- Weather -->
      <div class="panel active" data-commute="1">
        <div class="panel-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <g stroke="#000" stroke-width="2.4" stroke-linecap="round" fill="none">
              <circle cx="16" cy="15" r="6.5" fill="#fff"/>
              <path d="M16 3.5V6.5M24.13 6.87 22 9M27.5 15H24.5M7.87 6.87 10 9M4.5 15H7.5"/>
            </g>
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"
                  transform="translate(15,17)"
                  fill="#fff" stroke="#000" stroke-width="2.3" stroke-linejoin="round"/>
          </svg>
          <h2>天気</h2>
        </div>
        <div class="weather">
          <svg class="big-ico" id="wx-icon" viewBox="0 0 48 48" aria-hidden="true">
            <g stroke="#000" stroke-width="2.2" stroke-linecap="round" fill="none">
              <circle cx="16" cy="15" r="6.5" fill="#fff"/>
              <path d="M16 3.5V6.5M24.13 6.87 22 9M27.5 15H24.5M7.87 6.87 10 9M4.5 15H7.5"/>
            </g>
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"
                  transform="translate(15,17)"
                  fill="#fff" stroke="#000" stroke-width="2.1" stroke-linejoin="round"/>
          </svg>
          <div>
            <div class="temp"><span id="wx-temp">&hellip;</span>&deg;C</div>
            <div class="cond" id="wx-cond">&hellip;</div>
          </div>
        </div>
        <div class="wx-feels">体感温度 <span id="wx-feels">&hellip;</span>&deg;C</div>
        <div class="wx-grid">
          <div class="wx-stat">
            <div class="wx-label">最高 / 最低</div>
            <div class="wx-value"><span id="wx-high">&hellip;</span>&deg; / <span id="wx-low">&hellip;</span>&deg;</div>
          </div>
          <div class="wx-stat">
            <div class="wx-label">降水確率</div>
            <div class="wx-value"><span id="wx-precip">&hellip;</span>%</div>
          </div>
          <div class="wx-stat">
            <div class="wx-label">湿度</div>
            <div class="wx-value"><span id="wx-humidity">&hellip;</span>%</div>
          </div>
          <div class="wx-stat">
            <div class="wx-label">風</div>
            <div class="wx-value" id="wx-wind">&hellip;</div>
          </div>
          <div class="wx-stat">
            <div class="wx-label">UV指数</div>
            <div class="wx-value" id="wx-uv">&hellip;</div>
          </div>
          <div class="wx-stat">
            <div class="wx-label">日の出 / 日の入り</div>
            <div class="wx-value" id="wx-sun">&hellip;</div>
          </div>
        </div>
      </div>

      <!-- Train status -->
      <div class="panel">
        <div class="panel-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="6" width="24" height="26" rx="6" fill="none" stroke="#000" stroke-width="2.5"/>
            <rect x="16" y="11" width="16" height="9" rx="2" fill="#000"/>
            <circle cx="19" cy="26" r="2.4" fill="#000"/>
            <circle cx="29" cy="26" r="2.4" fill="#000"/>
            <path d="M17 33l-4 8M31 33l4 8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <h2>運行情報</h2>
        </div>
        <ul class="lines" id="linesList">
          <li><div class="line-name">読み込み中&hellip;</div></li>
        </ul>
      </div>

      <!-- Hatagaya next train (derived from the Keio feed above) -->
      <div class="panel" data-commute="1">
        <div class="panel-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="6" width="24" height="26" rx="6" fill="none" stroke="#000" stroke-width="2.5"/>
            <rect x="16" y="11" width="16" height="9" rx="2" fill="#000"/>
            <circle cx="19" cy="26" r="2.4" fill="#000"/>
            <circle cx="29" cy="26" r="2.4" fill="#000"/>
            <path d="M17 33l-4 8M31 33l4 8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <h2>幡ヶ谷 次の電車</h2>
        </div>
        <div id="hatagayaList">
          <div class="line-name">読み込み中&hellip;</div>
        </div>
      </div>

      <!-- Events -->
      <div class="panel">
        <div class="panel-head">
          <svg class="ico" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="6" y="9" width="36" height="33" rx="4" fill="none" stroke="#000" stroke-width="2.5"/>
            <path d="M6 18h36" stroke="#000" stroke-width="2.5"/>
            <path d="M15 5v8M33 5v8" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
            <g fill="#000">
              <rect x="13" y="24" width="4" height="4"/><rect x="22" y="24" width="4" height="4"/><rect x="31" y="24" width="4" height="4"/>
              <rect x="13" y="32" width="4" height="4"/><rect x="22" y="32" width="4" height="4"/><rect x="31" y="32" width="4" height="4"/>
            </g>
          </svg>
          <h2>今日の予定・タスク</h2>
        </div>
        <ul class="events" id="eventsList">
          <li><span>読み込み中&hellip;</span></li>
        </ul>
      </div>

      <!-- Todo (paginated, 5 per panel — filled in by JS) -->
      <div id="todoPanels"></div>
    </div>

    <div class="dots" id="dots"></div>

    <div class="spacer"></div>
  </div>

  <script>
    (function () {
      var REFRESH_MS = 5 * 60 * 1000; // e-ink panel: no need to poll fast
      var TODO_REFRESH_MS = 30 * 60 * 1000; // Trello: refresh on its own slower cadence, or on tap

      function el(tag, cls, html) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        return e;
      }

      // The server's clock (pinned to Asia/Tokyo — see main.go's /api/now),
      // not the Kindle's own — its clock/timezone can't be trusted. Falls
      // back to the local clock only if the fetch itself fails, so the
      // dashboard still renders something rather than going blank.
      var serverNow = new Date();

      // commuteMode mirrors main.go's inCommuteWindow: weekdays 11:00-13:30
      // server time. Computed server-side (not from the Kindle's clock) for
      // the same reason serverNow is — see /api/now. While active, the
      // rotator is restricted to just the weather + next-train panels.
      var commuteMode = false;

      // buildID identifies the server process currently running (see
      // main.go) — it changes on every deploy (a restart). The Kindle tab
      // stays open on this same static page indefinitely otherwise, so a
      // rebuilt backend/frontend would never actually reach it without this:
      // once the id we polled with differs from the one this page loaded
      // with, hard-reload to pick up the new HTML/JS/assets.
      var buildID = null;
      function loadServerNow() {
        return fetch('/api/now').then(function (r) { return r.json(); }).then(function (d) {
          if (buildID === null) {
            buildID = d.buildID;
          } else if (d.buildID && d.buildID !== buildID) {
            location.reload();
            return;
          }
          serverNow = new Date(d.now);
          var wasCommute = commuteMode;
          commuteMode = !!d.commuteMode;
          if (commuteMode !== wasCommute) {
            refreshRotationTargets();
            if (!commuteMode) hideCommuteAlert();
          }
        }).catch(function () { /* keep the previous serverNow / local fallback */ });
      }

      function setUpdated() {
        document.getElementById('updated').textContent =
          serverNow.toLocaleString('ja-JP', {
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit',
            timeZone: 'Asia/Tokyo'
          });
      }

      // ---- Weather ----
      // Each fragment below is drawn in a 48x48 viewBox to match the panel
      // markup that used to be hardcoded here (a static sun-behind-cloud
      // icon that never changed regardless of actual conditions).
      var WX_SUN_SMALL = '<g stroke="#000" stroke-width="2.2" stroke-linecap="round" fill="none">' +
        '<circle cx="16" cy="15" r="6.5" fill="#fff"/>' +
        '<path d="M16 3.5V6.5M24.13 6.87 22 9M27.5 15H24.5M7.87 6.87 10 9M4.5 15H7.5"/></g>';
      var WX_SUN_BIG = '<g stroke="#000" stroke-width="2.4" stroke-linecap="round" fill="none">' +
        '<circle cx="24" cy="24" r="10" fill="#fff"/>' +
        '<path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.5 9.5l4.2 4.2M34.3 34.3l4.2 4.2M9.5 38.5l4.2-4.2M34.3 13.7l4.2-4.2"/></g>';
      var WX_CLOUD_SMALL = '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" ' +
        'transform="translate(15,17)" fill="#fff" stroke="#000" stroke-width="2.1" stroke-linejoin="round"/>';
      var WX_CLOUD_BIG = '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" ' +
        'transform="translate(7,13) scale(1.35)" fill="#fff" stroke="#000" stroke-width="1.7" stroke-linejoin="round"/>';
      var WX_RAIN = '<g stroke="#000" stroke-width="2.4" stroke-linecap="round">' +
        '<path d="M17 38l3 6M25 38l3 6M33 38l3 6"/></g>';
      var WX_SNOW = '<g stroke="#000" stroke-width="2.2" stroke-linecap="round">' +
        '<path d="M17 39v6M14 42h6M25 39v6M22 42h6M33 39v6M30 42h6"/></g>';
      var WX_FOG = '<g stroke="#000" stroke-width="2.4" stroke-linecap="round">' +
        '<path d="M9 40h13M27 40h13M13 46h22"/></g>';
      var WX_THUNDER = '<path d="M26 36l-6 8h4l-6 4l10-8h-4l6-4z" fill="#000" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>';

      function weatherIconMarkup(icon) {
        switch (icon) {
          case 'clear': return WX_SUN_BIG;
          case 'cloudy': return WX_CLOUD_BIG;
          case 'fog': return WX_CLOUD_SMALL + WX_FOG;
          case 'rain': return WX_CLOUD_SMALL + WX_RAIN;
          case 'snow': return WX_CLOUD_SMALL + WX_SNOW;
          case 'thunder': return WX_CLOUD_SMALL + WX_THUNDER;
          case 'partly-cloudy':
          default: return WX_SUN_SMALL + WX_CLOUD_SMALL;
        }
      }

      function loadWeather() {
        fetch('/api/weather').then(function (r) { return r.json(); }).then(function (w) {
          if (w.error) throw new Error(w.error);
          document.getElementById('wx-icon').innerHTML = weatherIconMarkup(w.icon);
          document.getElementById('wx-temp').textContent = Math.round(w.tempC);
          document.getElementById('wx-cond').textContent = w.condition;
          document.getElementById('wx-feels').textContent = Math.round(w.feelsLikeC);
          document.getElementById('wx-high').textContent = Math.round(w.highC);
          document.getElementById('wx-low').textContent = Math.round(w.lowC);
          document.getElementById('wx-precip').textContent = w.precipPct;
          document.getElementById('wx-humidity').textContent = w.humidityPct;
          document.getElementById('wx-wind').textContent = Math.round(w.windKph) + ' km/h ' + w.windDir;
          document.getElementById('wx-uv').textContent = w.uvIndex.toFixed(1);
          document.getElementById('wx-sun').textContent = w.sunrise + ' / ' + w.sunset;
        }).catch(function () {
          document.getElementById('wx-cond').textContent = '取得できません';
        });
      }

      // ---- Train status (Keio's own feed + other operators via /api/lines) ----
      // Icons are JR East's own status set (traininfo.jreast.co.jp/train_info/
      // kanto.aspx: ico_info_{normal,delay,adjust,info,direct}.svg) so
      // severity reads the same way here as on their site — green circle,
      // orange triangle, red X, orange "!", grey through-service-cut arrow —
      // rather than collapsing every non-normal level into one icon. Keio/
      // Toei only ever report "stop" (full suspension, no JR-style "adjust"
      // vs "stopdirect" distinction), so it maps to the same red X as JR's
      // "adjust".
      var LINE_STATUS_ICON = {
        normal: './img/normal.svg',
        delay: './img/delay.svg',
        adjust: './img/adjust.svg',
        stop: './img/adjust.svg',
        stopdirect: './img/direct.svg',
        info: './img/info.svg',
        error: './img/info.svg'
      };
      function loadLines() {
        fetch('/api/lines').then(function (r) { return r.json(); }).then(function (lines) {
          var ul = document.getElementById('linesList');
          ul.innerHTML = '';
          (lines || []).forEach(function (s) {
            var icon = LINE_STATUS_ICON[s.level] || './img/info.svg';
            var li = el('li');
            var img = el('img', 'marker');
            img.src = icon; img.width = 22; img.height = 22;
            li.appendChild(img);
            li.appendChild(el('div', null,
              '<div class="line-name">' + s.name + '</div>' +
              '<div class="line-state">' + (s.text || '不明') + '</div>'));
            ul.appendChild(li);
          });
        }).catch(function () {
          document.getElementById('linesList').innerHTML = '<li><div class="line-name">取得できません</div></li>';
        });
      }

      // ---- Commute-mode "arriving soon" alert ----
      // Fires only during commuteMode, off the same /api/hatagaya payload
      // the next-train panel renders. "予定" rows are schedule-derived
      // estimates (no live position), too rough to page-worthy alert on —
      // only live-tracked trains (接近中/到着) count.
      var COMMUTE_ALERT_ETA_MIN = 5;
      function hideCommuteAlert() {
        document.getElementById('commuteAlert').hidden = true;
      }
      // Only the up direction toward the Toei Shinjuku Line / Motoyawata is
      // relevant to this alert — down trains (e.g. 笹塚行) never trigger it,
      // and within up, only through-service trains count (destination
      // mentions 都営新宿線, or the through terminus 本八幡); Hatagaya's up
      // direction also carries trains that just terminate at Keio's own
      // Shinjuku (新線新宿/京王線新宿), which don't.
      function isNotifiableUpTrain(t) {
        return t.destination.indexOf('都営新宿線') !== -1 || t.destination.indexOf('本八幡') !== -1;
      }
      function updateCommuteAlert(nt) {
        if (!commuteMode) { hideCommuteAlert(); return; }
        var soonest = null;
        (nt.up || []).forEach(function (t) {
          if (t.status === '予定' || t.etaMin > COMMUTE_ALERT_ETA_MIN) return;
          if (!isNotifiableUpTrain(t)) return;
          if (!soonest || t.etaMin < soonest.etaMin) soonest = t;
        });
        if (!soonest) { hideCommuteAlert(); return; }
        var etaText = soonest.status === '到着' ? '到着' : soonest.etaMin + '分後';
        document.getElementById('commuteAlertText').textContent =
          '上り ' + soonest.destination + '行 ' + etaText;
        document.getElementById('commuteAlert').hidden = false;
      }

      // ---- Hatagaya next trains (derived from the Keio feed — see hatagaya.go) ----
      // Rendered like a platform board: a big ETA number leads each row so
      // the soonest train is readable at a glance, with type/destination/
      // delay as secondary text beside it.
      function loadHatagaya() {
        fetch('/api/hatagaya').then(function (r) { return r.json(); }).then(function (nt) {
          nt = nt || {};
          updateCommuteAlert(nt);
          var wrap = document.getElementById('hatagayaList');
          wrap.innerHTML = '';
          [['up', '上り'], ['down', '下り']].forEach(function (pair) {
            var list = nt[pair[0]] || [];
            var grp = el('div', 'tgroup');
            grp.appendChild(el('div', 'tgroup-label', pair[1]));
            var ul = el('ul', 'trains');
            if (list.length === 0) {
              ul.appendChild(el('li', null,
                '<div class="tinfo"><div class="ttype">情報なし</div></div>'));
            } else {
              list.forEach(function (t) {
                var arriving = t.status === '到着';
                var eta = el('div', 'eta' + (arriving ? ' now' : ''),
                  arriving ? '到着' : t.etaMin + '<small>分</small>');
                var meta = t.status + (t.delayMin > 0 ? ' &middot; ' + t.delayMin + '分遅れ' : '');
                // Schedule-derived fallback entries (status "予定") carry no
                // train-type detail — omit the leading space that'd leave.
                var typePrefix = t.typeName ? t.typeName + ' ' : '';
                var info = el('div', 'tinfo' + (t.status === '予定' ? ' estimated' : ''),
                  '<div class="ttype">' + typePrefix + t.destination + '行</div>' +
                  '<div class="tmeta">' + meta + '</div>');
                var li = el('li');
                li.appendChild(eta);
                li.appendChild(info);
                ul.appendChild(li);
              });
            }
            grp.appendChild(ul);
            wrap.appendChild(grp);
          });
        }).catch(function () {
          document.getElementById('hatagayaList').innerHTML = '<div class="line-name">取得できません</div>';
        });
      }

      // ---- Today's events (Google Calendar) + Trello cards due this week ----
      // "This week" is a forward-looking rolling window: due today through
      // 6 days out. Deliberately excludes already-overdue cards — those
      // stay visible in the main Trello panels (sorted to the front there)
      // rather than cluttering this planning view indefinitely.
      function daysUntil(iso) {
        var due = new Date(iso);
        var dueDay = new Date(due.getFullYear(), due.getMonth(), due.getDate());
        var today = new Date(serverNow.getFullYear(), serverNow.getMonth(), serverNow.getDate());
        return Math.round((dueDay - today) / 86400000);
      }

      function loadEvents() {
        Promise.all([
          fetch('/api/events').then(function (r) { return r.json(); }).catch(function () { return null; }),
          fetch('/api/todos').then(function (r) { return r.json(); }).catch(function () { return null; })
        ]).then(function (results) {
          var events = results[0];
          var todos = results[1];
          var ul = document.getElementById('eventsList');
          ul.innerHTML = '';

          var hasEvents = Array.isArray(events) && events.length > 0;
          if (!hasEvents) {
            ul.appendChild(el('li', null, '<span>本日の予定はありません</span>'));
          } else {
            events.forEach(function (ev) {
              var li = el('li');
              li.appendChild(el('span', 't', ev.allDay ? '終日' : ev.time));
              li.appendChild(el('span', null, ev.title));
              ul.appendChild(li);
            });
          }

          var dueSoon = (Array.isArray(todos) ? todos : [])
            .filter(function (t) {
              if (!t.dueISO) return false;
              var days = daysUntil(t.dueISO);
              return days >= 0 && days <= 6;
            });
          if (dueSoon.length > 0) {
            ul.appendChild(el('li', 'subhead', '今週締め切りのタスク'));
            dueSoon.forEach(function (t) {
              var days = daysUntil(t.dueISO);
              var tagCls = 'tag' + (days === 0 ? ' due-today' : '');
              var li = el('li');
              li.appendChild(el('span', tagCls, t.due));
              li.appendChild(el('span', null, t.text));
              ul.appendChild(li);
            });
          }
        }).catch(function () {
          document.getElementById('eventsList').innerHTML = '<li><span>取得できません</span></li>';
        });
      }

      // ---- Todos (read-only view of a Trello board — see trello.go) ----
      // Paginated 5-per-panel: each page becomes its own .panel in the
      // rotation, so a long board doesn't cram everything onto one screen.
      var TODO_PAGE_SIZE = 5;

      function renderTodos(items) {
        var wrap = document.getElementById('todoPanels');
        wrap.innerHTML = '';
        var pages = Math.max(1, Math.ceil(items.length / TODO_PAGE_SIZE));

        for (var p = 0; p < pages; p++) {
          var chunk = items.slice(p * TODO_PAGE_SIZE, p * TODO_PAGE_SIZE + TODO_PAGE_SIZE);
          var panel = el('div', 'panel');

          var head = el('div', 'todo-head');
          head.appendChild(el('h2', null, '今日のタスク'));
          var countLabel = pages > 1
            ? (p + 1) + ' / ' + pages + ' ページ &middot; タスク' + items.length + '件'
            : 'タスク' + items.length + '件';
          head.appendChild(el('div', 'count', countLabel));
          panel.appendChild(head);

          var ul = el('ul', 'todo');
          if (chunk.length === 0) {
            ul.appendChild(el('li', null, '<div class="row"><span class="txt">タスクはありません</span></div>'));
          } else {
            chunk.forEach(function (t) {
              var li = el('li');
              var row = el('div', 'row');
              row.appendChild(el('span', 'txt', t.text));
              var badge = [t.list, t.due].filter(Boolean).join(' · ');
              if (badge) {
                row.appendChild(el('span', 'due' + (t.overdue ? ' overdue' : ''), badge));
              }
              li.appendChild(row);
              ul.appendChild(li);
            });
          }
          panel.appendChild(ul);
          wrap.appendChild(panel);
        }

        refreshRotationTargets();
      }

      // renderTodos rebuilds every todo-page .panel from scratch, which
      // would knock out whatever panel is currently active (e.g. right
      // after a tap navigates into a todo page). Skip the rebuild when the
      // data hasn't actually changed so navigation isn't disturbed.
      var lastTodosJSON = null;
      function loadTodos() {
        return fetch('/api/todos').then(function (r) { return r.json(); }).then(function (items) {
          var json = JSON.stringify(items);
          if (json === lastTodosJSON) return;
          lastTodosJSON = json;
          renderTodos(items);
        });
      }

      function loadAll() {
        loadServerNow().then(function () {
          setUpdated();
          loadEvents();
        });
        loadWeather();
        loadLines();
        loadHatagaya();
      }

      // ---- Rotator: cycle through panels full-width, one at a time.
      // E-ink flashes on every redraw, so this is deliberately slow.
      // Todo panels are rebuilt on every refresh (page count can change),
      // so the target list is recomputed rather than captured once. ----
      var ROTATE_MS = 25 * 1000;
      var dotsEl = document.getElementById('dots');
      var panels = [];
      var dots = [];
      var panelIndex = 0;

      function showPanel(i) {
        panels.forEach(function (p, pi) { p.classList.toggle('active', pi === i); });
        dots.forEach(function (d, di) { d.classList.toggle('active', di === i); });
      }

      function refreshRotationTargets() {
        var wasActive = panels[panelIndex];
        var all = Array.prototype.slice.call(document.querySelectorAll('.panel'));
        // Commute mode: weekdays 11:00-13:30 server time (main.go's
        // inCommuteWindow) — restrict the rotation to just the two panels
        // marked data-commute (weather + Hatagaya next-train), dropping
        // 運行情報/events/todo out of the cycle until the window ends.
        panels = commuteMode ? all.filter(function (p) { return p.dataset.commute === '1'; }) : all;
        // Panels dropped by the filter above may still carry .active from
        // before the mode switch — clear it so they don't render behind/
        // alongside whichever commute panel is now current.
        all.forEach(function (p) { if (panels.indexOf(p) === -1) p.classList.remove('active'); });
        dotsEl.innerHTML = '';
        panels.forEach(function () { dotsEl.appendChild(el('span')); });
        dots = Array.prototype.slice.call(dotsEl.children);
        var idx = panels.indexOf(wasActive);
        panelIndex = idx >= 0 ? idx : 0;
        showPanel(panelIndex);
      }

      var rotateTimer;
      function nextPanel() {
        panelIndex = (panelIndex + 1) % panels.length;
        showPanel(panelIndex);
      }
      function startRotation() {
        clearInterval(rotateTimer);
        rotateTimer = setInterval(nextPanel, ROTATE_MS);
      }

      refreshRotationTargets();
      startRotation();

      // Tap/click anywhere to advance immediately, restart the auto-rotate
      // timer from there, and force a fresh Trello pull (so checking a card
      // off on your phone shows up right away instead of waiting 30 min).
      document.body.addEventListener('click', function () {
        nextPanel();
        startRotation();
        loadTodos();
      });

      loadAll();
      setInterval(loadAll, REFRESH_MS);

      loadTodos();
      setInterval(loadTodos, TODO_REFRESH_MS);

      // Faster side-channel than the 5-minute REFRESH_MS, for two things
      // that shouldn't wait that long: detecting a new deploy (buildID, in
      // loadServerNow) at any time of day, and — only during commute mode —
      // a train crossing the 5-minute alert threshold or the 11:00/13:30
      // window boundary. Both endpoints are cheap (server-cached at 30s
      // already).
      var FAST_MS = 30 * 1000;
      setInterval(function () {
        loadServerNow();
        if (commuteMode) loadHatagaya();
      }, FAST_MS);
    })();
  </script>
</body>
</html>
